          package com.venas.hizligiris;

          import android.content.Context;
          import android.content.SharedPreferences;

          final class OtpStore {
              private OtpStore() {}

              private static final String PREF = "venas_hizli_giris";
              private static final long TTL_MS = 180_000L;

              static void save(
                      Context context,
                      String otp,
                      String reference,
                      long timestamp,
                      String source) {

                  prefs(context).edit()
                          .putString("otp", otp == null ? "" : otp)
                          .putString("reference", reference == null ? "" : reference)
                          .putString("source", source == null ? "" : source)
                          .putLong("timestamp", timestamp)
                          .putString(
                                  "last_event",
                                  (source == null ? "" : source) + ": 6 haneli kod yakalandı")
                          .putLong("last_event_ts", timestamp)
                          .apply();
              }

              static void note(Context context, String note) {
                  prefs(context).edit()
                          .putString("last_event", note == null ? "" : note)
                          .putLong("last_event_ts", System.currentTimeMillis())
                          .apply();
              }

              static Entry current(Context context) {
                  SharedPreferences p = prefs(context);

                  String otp = p.getString("otp", "");
                  String ref = p.getString("reference", "");
                  String source = p.getString("source", "");
                  long ts = p.getLong("timestamp", 0L);

                  if (otp == null || otp.length() != 6 || ts <= 0L) {
                      return null;
                  }

                  if (System.currentTimeMillis() - ts > TTL_MS) {
                      p.edit()
                              .remove("otp")
                              .remove("reference")
                              .remove("source")
                              .remove("timestamp")
                              .apply();
                      return null;
                  }

                  return new Entry(
                          otp,
                          ref == null ? "" : ref,
                          source == null ? "" : source,
                          ts);
              }

              static String lastEvent(Context context) {
                  return prefs(context).getString(
                          "last_event",
                          "Henüz İş Turkcell mesajı algılanmadı");
              }

              static long lastEventTime(Context context) {
                  return prefs(context).getLong("last_event_ts", 0L);
              }

              private static SharedPreferences prefs(Context context) {
                  return context.getSharedPreferences(PREF, Context.MODE_PRIVATE);
              }

              static final class Entry {
                  final String otp;
                  final String reference;
                  final String source;
                  final long timestamp;

                  Entry(String otp, String reference, String source, long timestamp) {
                      this.otp = otp;
                      this.reference = reference;
                      this.source = source;
                      this.timestamp = timestamp;
                  }
              }
          }
