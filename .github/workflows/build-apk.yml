          cat > app/src/main/java/com/venas/hizligiris/SmsReceiver.java <<'JAVA'
          package com.venas.hizligiris;

          import android.content.BroadcastReceiver;
          import android.content.Context;
          import android.content.Intent;
          import android.provider.Telephony;
          import android.telephony.SmsMessage;

          public class SmsReceiver extends BroadcastReceiver {
              @Override
              public void onReceive(Context context, Intent intent) {
                  if (context == null || intent == null) return;

                  if (!Telephony.Sms.Intents.SMS_RECEIVED_ACTION.equals(
                          intent.getAction())) {
                      return;
                  }

                  SmsMessage[] messages;

                  try {
                      messages =
                              Telephony.Sms.Intents.getMessagesFromIntent(intent);
                  } catch (Exception e) {
                      return;
                  }

                  if (messages == null || messages.length == 0) return;

                  StringBuilder body = new StringBuilder();

                  for (SmsMessage message : messages) {
                      if (message == null
                              || message.getMessageBody() == null) {
                          continue;
                      }

                      if (body.length() > 0) {
                          body.append(' ');
                      }

                      body.append(message.getMessageBody());
                  }

                  String text = body.toString();
                  OtpParser.Result result = OtpParser.parse(text);

                  if (result != null) {
                      OtpStore.save(
                              context,
                              result.otp,
                              result.reference,
                              System.currentTimeMillis(),
                              "SMS");
                  } else if (OtpParser.looksLikeContext(text)) {
                      OtpStore.note(
                              context,
                              "SMS geldi; İş Turkcell metni görüldü ama 6 haneli kod bulunamadı");
                  }
              }
          }
