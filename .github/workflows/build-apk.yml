name: Build Venas Hizli Giris APK v1.1.4

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Kaynak kodu al
        uses: actions/checkout@v4

      - name: Java 17 kur
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Android SDK kur
        uses: android-actions/setup-android@v3

      - name: Android paketlerini kur
        run: sdkmanager "platforms;android-36" "build-tools;35.0.0"

      - name: Android proje yapisini olustur
        shell: bash
        run: |
          set -e

          required=(ServerStatusClient.java strings.xml styles.xml venas_logo.png proguard-rules.pro)
          for f in "${required[@]}"; do
            if [ ! -f "$f" ]; then
              echo "EKSIK DOSYA: $f"
              exit 1
            fi
          done

          mkdir -p app/src/main/java/com/venas/hizligiris
          mkdir -p app/src/main/res/values
          mkdir -p app/src/main/res/drawable

          cp ServerStatusClient.java app/src/main/java/com/venas/hizligiris/ServerStatusClient.java
          cp strings.xml app/src/main/res/values/strings.xml
          cp styles.xml app/src/main/res/values/styles.xml
          cp venas_logo.png app/src/main/res/drawable/venas_logo.png
          cp proguard-rules.pro app/proguard-rules.pro

          cat > app/src/main/AndroidManifest.xml <<'XML'
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">

              <uses-permission android:name="android.permission.INTERNET" />
              <uses-permission android:name="android.permission.RECEIVE_SMS" />
              <uses-feature
                  android:name="android.hardware.telephony"
                  android:required="false" />

              <application
                  android:allowBackup="false"
                  android:icon="@drawable/venas_logo"
                  android:label="Venas Hızlı Giriş"
                  android:supportsRtl="true"
                  android:theme="@style/AppTheme"
                  android:usesCleartextTraffic="false">

                  <activity
                      android:name=".MainActivity"
                      android:exported="true">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>

                  <service
                      android:name=".OtpNotificationListener"
                      android:exported="true"
                      android:label="Venas Hızlı Giriş"
                      android:permission="android.permission.BIND_NOTIFICATION_LISTENER_SERVICE">
                      <intent-filter>
                          <action android:name="android.service.notification.NotificationListenerService" />
                      </intent-filter>
                  </service>

                  <receiver
                      android:name=".SmsReceiver"
                      android:exported="true">
                      <intent-filter android:priority="999">
                          <action android:name="android.provider.Telephony.SMS_RECEIVED" />
                      </intent-filter>
                  </receiver>

              </application>
          </manifest>
