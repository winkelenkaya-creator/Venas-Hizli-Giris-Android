              private void requestSmsPermission() {
                  if (checkSelfPermission(
                          Manifest.permission.RECEIVE_SMS)
                          == PackageManager.PERMISSION_GRANTED) {

                      Toast.makeText(
                              this,
                              "SMS izni zaten açık.",
                              Toast.LENGTH_SHORT)
                              .show();
                      return;
                  }

                  requestPermissions(
                          new String[]{
                                  Manifest.permission.RECEIVE_SMS
                          },
                          REQ_SMS);
              }

              @Override
              public void onRequestPermissionsResult(
                      int requestCode,
                      String[] permissions,
                      int[] grantResults) {

                  super.onRequestPermissionsResult(
                          requestCode,
                          permissions,
                          grantResults);

                  if (requestCode == REQ_SMS) {
                      if (grantResults.length > 0
                              && grantResults[0]
                              == PackageManager.PERMISSION_GRANTED) {

                          Toast.makeText(
                                  this,
                                  "SMS izni verildi.",
                                  Toast.LENGTH_SHORT)
                                  .show();
                      } else {
                          Toast.makeText(
                                  this,
                                  "SMS izni verilmedi. Bildirim erişimi yedek olarak kullanılabilir.",
                                  Toast.LENGTH_LONG)
                                  .show();
                      }

                      refresh();
                  }
              }

              private void refresh() {
                  boolean smsEnabled =
                          checkSelfPermission(
                                  Manifest.permission.RECEIVE_SMS)
                                  == PackageManager.PERMISSION_GRANTED;

                  smsStatus.setText(
                          smsEnabled
                                  ? "Aktif ✓"
                                  : "Kapalı — izin gerekli");

                  smsStatus.setTextColor(
                          smsEnabled
                                  ? Color.rgb(89, 219, 143)
                                  : Color.rgb(255, 178, 85));

                  boolean listenerEnabled =
                          isListenerEnabled();

                  listenerStatus.setText(
                          listenerEnabled
                                  ? "Aktif ✓"
                                  : "Kapalı — isteğe bağlı");

                  listenerStatus.setTextColor(
                          listenerEnabled
                                  ? Color.rgb(89, 219, 143)
                                  : Color.rgb(255, 178, 85));

                  String lastEvent =
                          OtpStore.lastEvent(this);

                  long lastEventTs =
                          OtpStore.lastEventTime(this);

                  if (lastEventTs > 0L) {
                      String stamp =
                              new SimpleDateFormat(
                                      "HH:mm:ss",
                                      Locale.getDefault())
                                      .format(
                                              new Date(
                                                      lastEventTs));

                      eventView.setText(
                              stamp + " • " + lastEvent);
                  } else {
                      eventView.setText(lastEvent);
                  }

                  OtpStore.Entry entry =
                          OtpStore.current(this);

                  if (entry == null) {
                      visibleOtp = "";
                      otpView.setText("------");
                      refView.setText("Referans: —");
                      timeView.setText(
                              "Yeni kod bekleniyor");
                      copyButton.setEnabled(false);
                      return;
                  }

                  visibleOtp = entry.otp;
                  otpView.setText(entry.otp);

                  refView.setText(
                          TextUtils.isEmpty(
                                  entry.reference)
                                  ? "Referans: bulunamadı"
                                  : "Referans: "
                                          + entry.reference);

                  String stamp =
                          new SimpleDateFormat(
                                  "HH:mm:ss",
                                  Locale.getDefault())
                                  .format(
                                          new Date(
                                                  entry.timestamp));

                  long left =
                          Math.max(
                                  0L,
                                  180L
                                          - ((System.currentTimeMillis()
                                          - entry.timestamp)
                                          / 1000L));

                  String source =
                          TextUtils.isEmpty(entry.source)
                                  ? ""
                                  : " • " + entry.source;

                  timeView.setText(
                          "Algılandı: "
                                  + stamp
                                  + source
                                  + " • "
                                  + left
                                  + " sn sonra temizlenir");

                  copyButton.setEnabled(true);
              }

              private void copyOtp() {
                  if (visibleOtp.length() != 6) return;

                  ClipboardManager cm =
                          (ClipboardManager)
                                  getSystemService(
                                          Context.CLIPBOARD_SERVICE);

                  if (cm == null) return;

                  cm.setPrimaryClip(
                          ClipData.newPlainText(
                                  "Venas Hızlı Giriş",
                                  visibleOtp));

                  Toast.makeText(
                          this,
                          "Kod panoya kopyalandı.",
                          Toast.LENGTH_SHORT)
                          .show();
              }

              private void testServer() {
                  serverView.setText(
                          "Test ediliyor…");

                  new Thread(() -> {
                      try {
                          int code =
                                  ServerStatusClient.check();

                          runOnUiThread(() -> {
                              if (code >= 200
                                      && code < 300) {

                                  serverView.setText(
                                          "Erişilebilir ✓  HTTP "
                                                  + code);

                                  serverView.setTextColor(
                                          Color.rgb(
                                                  89,
                                                  219,
                                                  143));
                              } else {
                                  serverView.setText(
                                          "Yanıt alındı: HTTP "
                                                  + code);

                                  serverView.setTextColor(
                                          Color.rgb(
                                                  255,
                                                  178,
                                                  85));
                              }
                          });
                      } catch (Exception e) {
                          runOnUiThread(() -> {
                              serverView.setText(
                                      "Bağlantı hatası");

                              serverView.setTextColor(
                                      Color.rgb(
                                              255,
                                              113,
                                              113));
                          });
                      }
                  }, "VenasStatusTest").start();
              }

              private boolean isListenerEnabled() {
                  String enabled =
                          Settings.Secure.getString(
                                  getContentResolver(),
                                  "enabled_notification_listeners");

                  if (enabled == null) return false;

                  ComponentName me =
                          new ComponentName(
                                  this,
                                  OtpNotificationListener.class);

                  return enabled.contains(
                          me.flattenToString())
                          || enabled.contains(
                                  getPackageName());
              }

              private LinearLayout card(
                      String label,
                      TextView value) {

                  LinearLayout box =
                          new LinearLayout(this);

                  box.setOrientation(
                          LinearLayout.VERTICAL);

                  box.setPadding(
                          dp(16),
                          dp(14),
                          dp(16),
                          dp(14));

                  box.setBackgroundColor(
                          Color.rgb(18, 24, 34));

                  TextView labelView =
                          text(
                                  label,
                                  12,
                                  true,
                                  Color.rgb(
                                          137,
                                          150,
                                          171));

                  box.addView(
                          labelView,
                          matchWrap());

                  value.setPadding(
                          0,
                          dp(5),
                          0,
                          0);

                  box.addView(
                          value,
                          matchWrap());

                  LinearLayout.LayoutParams lp =
                          new LinearLayout.LayoutParams(
                                  LinearLayout.LayoutParams.MATCH_PARENT,
                                  LinearLayout.LayoutParams.WRAP_CONTENT);

                  lp.setMargins(
                          0,
                          dp(8),
                          0,
                          dp(8));

                  box.setLayoutParams(lp);
                  return box;
              }

              private TextView text(
                      String value,
                      int sp,
                      boolean bold,
                      int color) {

                  TextView tv =
                          new TextView(this);

                  tv.setText(value);
                  tv.setTextSize(sp);
                  tv.setTextColor(color);

                  if (bold) {
                      tv.setTypeface(
                              Typeface.DEFAULT,
                              Typeface.BOLD);
                  }

                  return tv;
              }

              private Button button(
                      String label) {

                  Button b =
                          new Button(this);

                  b.setText(label);
                  b.setTextSize(14);

                  b.setTypeface(
                          Typeface.DEFAULT,
                          Typeface.BOLD);

                  b.setTextColor(
                          Color.WHITE);

                  b.setBackgroundTintList(
                          android.content.res.ColorStateList.valueOf(
                                  Color.rgb(
                                          35,
                                          104,
                                          224)));

                  b.setAllCaps(false);
                  return b;
              }

              private LinearLayout.LayoutParams buttonLp() {
                  LinearLayout.LayoutParams lp =
                          new LinearLayout.LayoutParams(
                                  LinearLayout.LayoutParams.MATCH_PARENT,
                                  dp(54));

                  lp.setMargins(
                          0,
                          dp(8),
                          0,
                          dp(10));

                  return lp;
              }

              private LinearLayout.LayoutParams matchWrap() {
                  return new LinearLayout.LayoutParams(
                          LinearLayout.LayoutParams.MATCH_PARENT,
                          LinearLayout.LayoutParams.WRAP_CONTENT);
              }

              private int dp(int value) {
                  return Math.round(
                          value
                                  * getResources()
                                  .getDisplayMetrics()
                                  .density);
              }
          }
