          package com.venas.hizligiris;

          import java.util.Locale;
          import java.util.regex.Matcher;
          import java.util.regex.Pattern;

          final class OtpParser {
              private OtpParser() {}

              private static final Pattern SIX_DIGIT =
                      Pattern.compile("(?<!\\d)(\\d{6})(?!\\d)");

              private static final Pattern REF_PATTERN =
                      Pattern.compile(
                              "(?i)referans\\s*[:\\-]?\\s*([A-Z0-9]{4,12}(?:\\s+B\\d{3})?)");

              static boolean looksLikeContext(String text) {
                  if (text == null) return false;
                  String c = canonicalize(text);
                  return c.contains("hizli giris")
                          || c.contains("isturkcell")
                          || c.contains("is turkcell")
                          || (c.contains("sifreniz") && c.contains("giris"));
              }

              static Result parse(String text) {
                  if (text == null || text.trim().isEmpty()) return null;

                  String clean = text
                          .replace('\u00A0', ' ')
                          .replace('\u200B', ' ')
                          .replace('\u200C', ' ')
                          .replace('\u200D', ' ')
                          .replace('\n', ' ')
                          .replace('\r', ' ')
                          .replace('\t', ' ');

                  String canonical = canonicalize(clean);
                  if (!looksLikeContext(clean)) return null;

                  String otp = null;

                  int marker = canonical.indexOf("sifreniz");
                  if (marker >= 0) {
                      Matcher near = SIX_DIGIT.matcher(canonical.substring(marker));
                      if (near.find() && near.start() <= 80) {
                          otp = near.group(1);
                      }
                  }

                  if (otp == null) {
                      Matcher any = SIX_DIGIT.matcher(canonical);
                      if (any.find()) {
                          otp = any.group(1);
                      }
                  }

                  if (otp == null) return null;

                  String reference = "";
                  Matcher refMatcher = REF_PATTERN.matcher(clean);
                  if (refMatcher.find()) {
                      reference = refMatcher.group(1).trim().toUpperCase(Locale.ROOT);
                  }

                  return new Result(otp, reference);
              }

              private static String canonicalize(String s) {
                  String c = s.toLowerCase(new Locale("tr", "TR"));
                  c = c.replace('ı', 'i')
                       .replace('ş', 's')
                       .replace('ğ', 'g')
                       .replace('ü', 'u')
                       .replace('ö', 'o')
                       .replace('ç', 'c');

                  c = c.replaceAll("[^a-z0-9]+", " ");
                  return c.trim().replaceAll("\\s+", " ");
              }

              static final class Result {
                  final String otp;
                  final String reference;

                  Result(String otp, String reference) {
                      this.otp = otp;
                      this.reference = reference;
                  }
              }
          }
